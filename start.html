<body>
<div id="app">

<script>
  // Base URL for jsDelivr CDN
  var _cdnBase='https://cdn.jsdelivr.net/gh/JustXylia/relic-restoration-db@main/';
  
  // Override fetch to rewrite relative paths to CDN URLs
  var _origFetch=window.fetch;
  window.fetch=function(url,opts){
    if(typeof url==='string'&&!url.startsWith('http')&&!url.startsWith('blob:')&&!url.startsWith('data:')){
      // API calls go to localhost (server sync)
      if(url.startsWith('/api/')){
        url='http://localhost:8080'+url;
      }else{
        url=_cdnBase+url.replace(/^\//,'');
      }
    }
    return _origFetch.call(window,url,opts);
  };
  
  // Load Vue.js from CDN
  function loadScript(src,callback){
    var s=document.createElement('script');
    s.src=src;
    s.onload=callback;
    s.onerror=function(){console.error('Failed to load:',src);};
    document.head.appendChild(s);
  }
  
  // Load Vue first, then app.js
  loadScript(_cdnBase+'vue.global.prod.js',function(){
    loadScript(_cdnBase+'app.js',function(){
      // App will mount automatically
    });
  });
</script>
</body>
